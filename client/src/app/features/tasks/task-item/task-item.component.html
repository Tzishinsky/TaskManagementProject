<div class="card h-100 shadow-sm border-0">

  <div class="card-body d-flex flex-column">

    <div class="mb-3">

      <h3 class="h5 card-title mb-0">
        {{ task().title }}
      </h3>

    </div>

    @if (task().description) {

      <p class="card-text text-body-secondary mb-4">
        {{ task().description }}
      </p>

    }

    <div class="row g-3 mb-4">

      <div class="col-12 col-sm-6">

        <div class="small text-body-secondary mb-1">
          {{ text.task.priority }}
        </div>

        <span class="badge text-bg-secondary">
          {{ priorityLabels[task().priority] }}
        </span>

      </div>

      <div class="col-12 col-sm-6">

        <div class="small text-body-secondary mb-1">
           {{ text.task.status }}
        </div>

        <span class="badge text-bg-secondary">
         {{ statusLabels[task().status] }}
        </span>

      </div>

      @if (task().dueDate) {

        <div class="col-12">

          <div class="small text-body-secondary mb-1">
            {{ text.task.dueDate }}
          </div>

          <div>
            {{ task().dueDate | date:'dd/MM/yyyy' }}
          </div>

        </div>

      }

    </div>

    <div class="d-flex justify-content-end gap-2 mt-auto">

     <button
  type="button"
  class="btn btn-outline-primary"
  (click)="onEdit()"
  [attr.aria-label]="text.task.edit">

  <i
    class="bi bi-pencil"
    aria-hidden="true">
  </i>

  <span class="visually-hidden">
    {{ text.task.edit }}
  </span>

</button>

<button
  type="button"
  class="btn btn-outline-danger"
  (click)="onDelete()"
  [attr.aria-label]="text.task.delete">

  <i
    class="bi bi-trash"
    aria-hidden="true">
  </i>

  <span class="visually-hidden">
    {{ text.task.delete }}
  </span>

</button>

    </div>

  </div>

</div>
